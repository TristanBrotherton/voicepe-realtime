[tool.poetry]
name = "openai-realtime-voice-agent"
version = "0.1.0"
description = "Home Assistant addon for OpenAI Realtime API voice control with WebSocket support using Pipecat"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Pinned exactly: this codebase targets the Pipecat 1.x API (LLMContext,
# InterruptionFrame, FrameSerializer as a BaseObject, FastAPI websocket
# client without a binary/text mode, MCPClient with one owned session).
# 1.13.0 is the version this was developed/tested against. On any Pipecat
# upgrade, re-check the places that reach into pipecat internals (each is
# commented): the custom mixed transport (websocket client, media sender
# buffer), the tool-wait override in app/tool_guards.py, the realtime
# service's context pre-seed and the Live service's reconnect hooks.
pipecat-ai = {extras = ["mcp", "openai", "websocket"], version = "1.13.0"}
python-dotenv = ">=1.0.0"
# Voice-print speaker ID (fork): ONNX speaker-embedding runtime. Ships
# manylinux aarch64/amd64 wheels; the model file itself is fetched in the
# Dockerfile (small, pinned).
sherpa-onnx = ">=1.10.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
websockets = ">=13.0"

[tool.poetry.scripts]
start = "app.main:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
