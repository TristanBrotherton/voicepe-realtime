# Nederlandse namen + uitleg voor het Configuratie-tabblad. Gebruikers met
# Home Assistant in het Nederlands zien automatisch deze teksten; anderen de
# Engelse (en.yaml). Groepen via emoji-prefix — zelfde volgorde als config.yaml.
configuration:
  # --- 🔑 Basis ---
  openai_api_key:
    name: "🔑 Basis · OpenAI API-sleutel"
    description: >-
      Je persoonlijke OpenAI-sleutel (begint met sk-...). Maak er één aan op
      platform.openai.com → API keys, en zorg dat facturering is ingesteld.
      Alles wat de assistent doet — luisteren, denken, praten, zoeken op
      internet — loopt via deze sleutel.
  instructions:
    name: "🔑 Basis · Persoonlijkheid (systeemprompt)"
    description: >-
      Instructies in gewone taal die de assistent vormen: karakter, taal en
      huisregels. Schrijf het alsof je een persoon instrueert. Twee tips die
      er op een spraakapparaat toe doen: leg de taal vast ("Spreek en versta
      uitsluitend Nederlands. Wissel nooit van taal.") en zeg dat hij zijn
      gereedschap stil moet gebruiken in plaats van "momentje" te zeggen.
      BEWERK-TIP: dit veld is hier één regel (een beperking van de Home
      Assistant-interface) — gebruik voor comfortabel bewerken het ⋮-menu
      bovenaan dit tabblad → "Bewerken als YAML": dan krijg je een volwaardige
      teksteditor.
  transcription_language:
    name: "🔑 Basis · Spreektaal (bijv. nl, en, de)"
    description: >-
      Tweeletterige code van de taal die je tegen het apparaat spreekt. Dit
      voorkomt dat de assistent naar een andere taal afdwaalt, ÉN schrijft wat
      jij zei in het add-on-log (de 🗣️-regels — handig om te zien wat hij
      verstond). Leeg = automatisch detecteren (geen transcript in het log).

  # --- 🗣️ Model & stem ---
  openai_model:
    name: "🗣️ Model & stem · Model"
    description: >-
      Het OpenAI-model dat luistert en praat. gpt-realtime-2 (standaard) is
      het nieuwste en slimste. gpt-realtime-mini is merkbaar goedkoper maar
      minder slim. Wil je een model dat er niet tussen staat? Kies "custom"
      en zet onderaan deze pagina "Toon ongebruikte optionele
      configuratie-opties" aan om het custom-veld zichtbaar te maken.
  openai_model_custom:
    name: "🗣️ Model & stem · Model (custom)"
    description: >-
      Alleen gebruikt als Model op "custom" staat. Elk geldig OpenAI
      Realtime-model-id. (Standaard verborgen — dit is een expert-optie.)
  openai_voice:
    name: "🗣️ Model & stem · Stem"
    description: >-
      De stem waarmee hij praat. marin en cedar zijn de nieuwste en klinken
      het natuurlijkst. Een lopend gesprek houdt zijn stem — herstart de
      add-on na het wijzigen. Voor een stem die er niet tussen staat: kies
      "custom" en zet onderaan "Toon ongebruikte optionele
      configuratie-opties" aan. GPT-Live heeft ook regionale stemmen; vesper
      is de natuurlijke Britse mannenstem.
  openai_voice_custom:
    name: "🗣️ Model & stem · Stem (custom)"
    description: >-
      Alleen gebruikt als Stem op "custom" staat. Elke geldige OpenAI API-
      stemnaam. Gebruik bij GPT-Live vesper voor de natuurlijke Britse
      mannenstem. (Standaard verborgen.)
  openai_speed:
    name: "🗣️ Model & stem · Spreektempo"
    description: >-
      1.0 = normaal. Lager is langzamer en duidelijker (minimaal 0.25), hoger
      is sneller (maximaal 1.5). Verandert alleen het tempo, niet de woorden.
  max_output_tokens:
    name: "🗣️ Model & stem · Maximale antwoordlengte"
    description: >-
      Begrenst hoe lang een antwoord mag worden, in tokens (≈ 0,75 woord per
      stuk). 0 = geen limiet. Zet bijv. 1024 als hij soms blijft doorpraten;
      te laag kapt antwoorden midden in een zin af.

  # --- 💬 Gesprek ---
  follow_up_listen_seconds:
    name: "💬 Gesprek · Naluisteren (seconden)"
    description: >-
      Na een antwoord blijft het apparaat zo lang luisteren, zodat je gewoon
      kunt doorpraten — zonder opnieuw het wake-woord te zeggen. De LED-ring
      toont ondertussen de luisterkleur. 8 voelt natuurlijk; 0 zet het uit
      (wake-woord voor elke vraag).
  follow_up_open_delay_ms:
    name: "💬 Gesprek · Naluister-vertraging (ms)"
    description: >-
      Korte pauze tussen het einde van een antwoord en het heropenen van de
      microfoon, zodat de laatste echo uit de speaker geen spookvraag kan
      veroorzaken. 700 (standaard) dekt de speaker-naloop veilig af. Lager
      (300–500) maakt doorpraten vlotter, maar dan kan de assistent zijn
      eigen echo gaan beantwoorden — verhoog weer als hij soms "tegen
      niemand" praat of zichzelf herhaalt.
  wake_open_delay_ms:
    name: "💬 Gesprek · Wake-microfoon-vertraging (ms)"
    description: >-
      Dezelfde echo-bescherming vlak na het wake-woord: een korte pauze na de
      wake-toon voordat de microfoon opengaat, zodat het geluid van de toon
      zelf niet naar binnen lekt en als vraag wordt opgevat. 700 (standaard)
      is veilig. Lager voor een vlottere wake; verhoog als het uitspreken van
      het wake-woord soms een antwoord op niets uitlokt.
  vad_eagerness:
    name: "💬 Gesprek · Beurtwissel-snelheid"
    description: >-
      Hoe snel de assistent beslist dat je uitgesproken bent. "low"
      (standaard) wacht geduldig — het fijnst als je midden in een zin even
      nadenkt. "high" antwoordt sneller maar kan je afkappen. "auto" laat
      OpenAI kiezen.
  phase_idle_debounce_ms:
    name: "💬 Gesprek · Einde-antwoord-marge (ms)"
    description: >-
      Hoe lang de assistent stil moet zijn voordat het apparaat het antwoord
      als afgerond beschouwt. Dit overbrugt de natuurlijke pauzes tussen
      zinnen en tijdens smart-home-acties, zodat de LED en het "stop"-woord
      het hele antwoord blijven werken. 1500 is een goede standaard; verhoog
      als het apparaat midden in lange antwoorden al op rust springt.

  # --- 🌐 Websearch ---
  enable_web_search:
    name: "🌐 Websearch · Zoeken op internet"
    description: >-
      Laat de assistent dingen online opzoeken: weer, nieuws, openingstijden,
      actualiteiten. Elke zoekactie is één extra OpenAI-aanroep op jouw
      sleutel (een paar cent) en duurt een paar seconden extra. Standaard aan.
  web_search_model:
    name: "🌐 Websearch · Zoekmodel"
    description: >-
      Het model dat de zoekopdracht uitvoert en het antwoord samenvat.
      gpt-5.5 (standaard) geeft de beste antwoorden; mini/nano-modellen zijn
      goedkoper maar missen meer. Voor een ander model: kies "custom" en zet
      onderaan "Toon ongebruikte optionele configuratie-opties" aan.
  web_search_model_custom:
    name: "🌐 Websearch · Zoekmodel (custom)"
    description: >-
      Alleen gebruikt als Zoekmodel op "custom" staat. Elk model dat OpenAI's
      web_search-tool ondersteunt. (Standaard verborgen.)

  # --- 🎚️ Audio ---
  playback_prebuffer_ms:
    name: "🎚️ Audio · Afspeelbuffer (ms)"
    description: >-
      Hoeveel van het antwoord het apparaat verzamelt voordat het begint af te
      spelen. Een grotere buffer vangt korte wifi-haperingen op (het
      incidentele krakje), maar elk antwoord begint zoveel later. 150 is een
      goede balans; verhoog naar 250–300 bij blijvend kraken, 0 = direct
      afspelen.
  noise_reduction:
    name: "🎚️ Audio · Microfoon-ruisonderdrukking"
    description: >-
      Extra filtering van je stem voordat die naar OpenAI gaat. "off" is
      meestal prima — het apparaat filtert zelf al. Probeer "near_field" als
      je dichtbij praat, "far_field" voor door de kamer heen, wanneer hij je
      in een rumoerige omgeving slecht verstaat.

  # --- 🏠 Home Assistant ---
  ha_mcp_url:
    name: "🏠 Home Assistant · MCP-server-URL"
    description: >-
      Hoe de assistent je huis bestuurt. LEEG laten (aanbevolen): dan gebruikt
      hij Home Assistants ingebouwde "MCP Server"-integratie — installeer die
      integratie en stel je entiteiten beschikbaar aan Assist. Vul alleen een
      URL in als je de losse ha-mcp-add-on gebruikt.
  longlived_token:
    name: "🏠 Home Assistant · Toegangstoken"
    description: >-
      Leeg laten (aanbevolen): de add-on gebruikt zijn eigen ingebouwde
      toestemming. Maak alleen een long-lived token aan (je HA-profiel →
      Beveiliging) als het log bij het opstarten een 401/403-fout toont.
  mcp_tool_allowlist:
    name: "🏠 Home Assistant · Tool-allowlist"
    description: >-
      Kommagescheiden lijst van besturingstools die de assistent mag
      gebruiken; leeg = allemaal. Met de ingebouwde MCP-server kun je dit
      leeg laten. Vooral nuttig met de ha-mcp-add-on (80+ tools) om gesprekken
      snel en goedkoop te houden.

  # --- ⚙️ Geavanceerd ---
  websocket_port:
    name: "⚙️ Geavanceerd · Apparaat-poort"
    description: >-
      De poort waarop de Voice PE verbindt. Moet overeenkomen met de va_url in
      de apparaat-firmware (stable 8080, dev 8081). Alleen wijzigen bij een
      poortconflict — en pas dan ook de firmware-stub aan.
  session_reuse_timeout_seconds:
    name: "⚙️ Geavanceerd · Gesprek hervatten binnen (seconden)"
    description: >-
      Verbindt het apparaat binnen dit aantal seconden opnieuw (wifi-hapering,
      add-on-herstart), dan gaat het gesprek verder waar het was. 300 (5 min)
      is een goede standaard; 0 = altijd opnieuw beginnen.
  max_context_messages:
    name: "⚙️ Geavanceerd · Gespreksgeheugen (berichten)"
    description: >-
      Hoeveel recente uitwisselingen de assistent binnen een gesprek onthoudt.
      Meer = beter geheugen, maar elk antwoord rekent de hele historie opnieuw
      af, dus lange gesprekken worden duurder en kunnen tegen OpenAI-limieten
      aanlopen. 12 is een goede balans; 0 = onbeperkt.
  transcription_model:
    name: "⚙️ Geavanceerd · Transcriptmodel"
    description: >-
      Alleen gebruikt als bij Basis een spreektaal is ingesteld. Dit model
      schrijft jouw spraak als tekst in het log — het beïnvloedt NIET hoe de
      assistent je verstaat (die hoort je echte stem). gpt-live-transcribe is
      geoptimaliseerd voor snelle live-transcriptie; gpt-transcribe voor
      voltooide audio. gpt-4o-transcribe blijft de standaard. Voor een ander
      model: kies "custom" en zet onderaan "Toon ongebruikte optionele
      configuratie-opties" aan.
  transcription_model_custom:
    name: "⚙️ Geavanceerd · Transcriptmodel (custom)"
    description: >-
      Alleen gebruikt als Transcriptmodel op "custom" staat. (Standaard
      verborgen.)
  turn_detection_type:
    name: "⚙️ Geavanceerd · Beurtdetectie (legacy)"
    description: >-
      Hoe het einde van je vraag wordt herkend. Normaal NIET instellen: de
      assistent begrijpt dan zelf wanneer je zin af is (semantic_vad).
      "server_vad" is de oude stiltetimer-methode, afgesteld met de drie
      velden hieronder — alleen bewaard als noodluik.
  vad_threshold:
    name: "⚙️ Geavanceerd · server_vad: geluidsdrempel"
    description: >-
      Alleen bij server_vad. Hoe hard iets moet klinken om als spraak te
      tellen (0–1, standaard 0.5). Hoger = minder valse triggers door
      achtergrondgeluid.
  vad_prefix_padding_ms:
    name: "⚙️ Geavanceerd · server_vad: aanloop (ms)"
    description: >-
      Alleen bij server_vad. Audio van vlak vóór de spraakdetectie die wordt
      meegenomen, zodat je eerste woord niet wegvalt (standaard 300).
  vad_silence_duration_ms:
    name: "⚙️ Geavanceerd · server_vad: stilte = einde vraag (ms)"
    description: >-
      Alleen bij server_vad. Hoe lang een stilte je vraag beëindigt
      (standaard 800). Verhoog als je wordt afgekapt bij een pauze.

  # --- 🧪 Spraakruntime (GPT-Live canary; verborgen, optioneel) ---
  voice_runtime:
    name: "🧪 Spraakruntime · Runtime (realtime of live)"
    description: >-
      Welk OpenAI-spraakprotocol wordt gebruikt. Leeg of "realtime" houdt de
      OpenAI Realtime API (openai_model, openai_voice, VAD-opties). "live"
      schakelt deze instantie over op GPT-Live (gpt-live-1): full-duplex
      spraak met tools op een gedelegeerd Responses-model. Experimenteel —
      lees eerst de GPT-Live-sectie in de documentatie, herstart daarna.
  live_model:
    name: "🧪 Spraakruntime · Live-model"
    description: >-
      Het GPT-Live-spraakmodel, alleen gebruikt bij runtime "live".
      Standaard gpt-live-1.
  live_backend_model:
    name: "🧪 Spraakruntime · Live-backendmodel"
    description: >-
      Het Responses-model dat redeneert en tools aanroept voor GPT-Live.
      Standaard gpt-6-luna; gpt-6-sol voor moeilijkere taken.
  live_reasoning_effort:
    name: "🧪 Spraakruntime · Redeneerinspanning backend"
    description: >-
      Redeneerinspanning van het backendmodel. Lager is sneller; standaard low.
  live_service_tier:
    name: "🧪 Spraakruntime · Service-tier backend"
    description: >-
      Responses-service-tier voor gedelegeerde verzoeken (auto, default,
      flex, priority). Leeg = projectstandaard.
  live_backend_instructions:
    name: "🧪 Spraakruntime · Backendinstructies"
    description: >-
      Optionele prompt voor het backendmodel (taakregels, toolprocedures).
      Leeg = de ingebouwde backendprompt. De gespreksstijl blijft in
      "Persoonlijkheid van de assistent".
  live_acknowledge_gaps:
    name: "🧪 Spraakruntime · GPT-Live-beperkingen accepteren"
    description: >-
      GPT-Live biedt nog niet elke Realtime-functie (het add-on-log toont
      het pariteitsrapport bij het starten; nu: geen kostensensor per
      antwoord). De live-runtime start pas als dit aan staat.
  live_audio_capture_ms:
    name: "🧪 Spraakruntime · Ruwe antwoordaudio bewaren voor diagnose (ms)"
    description: >-
      Alleen om een vervormd GPT-Live-antwoord te onderzoeken. Houdt zoveel
      milliseconden ruwe modeluitvoer in het geheugen zodat de golfvorm
      bekeken kan worden; dit is de stem van de assistent, dus laat het op 0
      staan tenzij je onderzoek doet. De formaatcontroles die zo'n rapport
      nodig heeft (samplefrequentie, byte-uitlijning, niveaus, chunk- en
      gatentellers, een hash) staan altijd in het log.
  live_stream_replies:
    name: "🧪 Spraakruntime · Definitieve antwoorden streamen"
    description: >-
      Optionele canary (standaard uit). Speelt een geverifieerd definitief
      antwoord na een tool af terwijl de audio binnenkomt, in plaats van op
      het hele antwoord en de eindstilte te wachten. Spraak vóór tools,
      antwoorden zonder tool en bevestigingsvragen blijven volledig gebufferd.
  live_router:
    name: "🧪 Spraakruntime · Routermodus"
    description: >-
      Optioneel (standaard aan). De add-on stuurt elk verzoek zelf door (eerst
      de lokale opdrachten van Home Assistant, anders de eigen backend met
      alle tools), en de stem bevestigt kort en spreekt daarna alleen
      resultaten uit die een tool heeft bevestigd. Zet uit voor de oudere
      modus waarin de stem zelf beslist wanneer de backend wordt ingeschakeld.
  ack_silent_tools:
    name: "💬 Gesprek · Tools die nooit een gesproken bevestiging krijgen"
    description: >-
      Optionele, door komma's gescheiden toolnamen die nooit de bevestiging
      "Een moment." mogen activeren, ongeacht hun gemeten mediaan. Standaard
      GetDateTime,GetLiveContext,get_items,HassCancelAllTimers: snelle lokale
      leesacties zonder stilte om op te vullen.
  live_auto_expose:
    name: "🧪 Spraakruntime · Nieuwe entiteiten aan Assist tonen"
    description: >-
      Optioneel (standaard uit). Alleen in routermodus. Indien aan, stelt de
      add-on elke 5 minuten elke ingeschakelde, zichtbare entiteit in een
      bedienbaar domein die Assist nog niet ziet beschikbaar voor Assist.
      Helpers en scripts alleen als ze op een dashboard staan; sloten nooit.
      Een entiteit die je bewust verborgen hebt, blijft verborgen. Geldt voor
      elke Assist-gespreksagent, niet alleen deze add-on.
  live_context_entities:
    name: "🧪 Spraakruntime · Entiteiten voor de huisstatus"
    description: >-
      Optioneel (standaard leeg = uit). Alleen in routermodus. Entiteit-id's,
      gescheiden door komma's, bijvoorbeeld lock.front_door,
      cover.garage_door, sensor.outdoor_temperature (maximaal 30). Hun status
      wordt bij elke wake uit Home Assistant gelezen, tegelijk met het openen
      van de sessie, en als korte momentopname (maximaal 1.500 tekens) aan de
      backend gegeven. Overgeslagen als Home Assistant niet binnen 0,8
      seconden antwoordt; vertraagt nooit een antwoord.
  live_fast_chat_model:
    name: "🧪 Spraakruntime · Model voor snelle chat"
    description: >-
      Optioneel (standaard aan, gpt-5.4-nano). In routermodus laat een kleine
      classificatie zonder tools gewone chat het oordeel van de backend
      overslaan; alleen een chatoordeel doet iets, nooit een verzoek. Laat
      leeg of zet op off om het uit te schakelen.
  openclaw_callback_url:
    name: "🧺 Lange taken · Terugmeld-URL"
    description: >-
      Optioneel. Wordt als callback_url naar de agentbrug gestuurd, zodat een lange taak met POST /task-result kan terugmelden.
  live_task_promote_s:
    name: "🧺 Lange taken · Zacht budget"
    description: >-
      Optioneel (standaard 3,5 s). Daarna wordt een verzoek een achtergrondtaak: de stem zegt dat het nog bezig is en het gesprek gaat door.
  live_task_hold_session_s:
    name: "🧺 Lange taken · Sessiegrens"
    description: >-
      Optioneel (standaard 90 s). Harde grens voor hoe lang een trage opzoeking de open (betaalde) sessie mag vasthouden; daarna sluit de sessie gewoon en komt het resultaat later.
  discussions_enabled:
    name: "🗂️ Discussies · Aan"
    description: >-
      Optioneel (standaard uit). Laat de eigenaar de open punten van de agent-bridge horen en bespreken ("wat heeft mij nodig?"). Een besluit wordt teruggelezen, door de bridge klaargezet en telt pas na bevestiging per bericht.
  discussion_max_session_s:
    name: "🗂️ Discussies · Sessiegrens"
    description: >-
      Optioneel (standaard 900 s). Hoe lang een sessie mag duren zodra een discussie open is; de daglimieten blijven gelden.
  discussion_quiet_s:
    name: "🗂️ Discussies · Stiltevenster"
    description: >-
      Optioneel (standaard 30 s). Hoe lang de sessie tijdens een discussie op de volgende woorden wacht.
  discussion_follow_up_ms:
    name: "🗂️ Discussies · Nalisteren apparaat"
    description: >-
      Optioneel (standaard 10000 ms). Hoe lang het apparaat na elk antwoord blijft luisteren tijdens een discussie.
  live_task_delivery:
    name: "🧺 Lange taken · Resultaatroutes"
    description: >-
      Optioneel (standaard session,reopen,announce,imessage). Volgorde waarin het resultaat van een afgeronde opzoeking wordt bezorgd.
  live_task_deferred_delivery:
    name: "🧺 Lange taken · Routes voor uitgestelde resultaten"
    description: >-
      Optioneel (standaard session,announce,reopen,imessage). Volgorde voor een uitgesteld resultaat ("zeg het als ...").
  live_task_quiet_hours:
    name: "🧺 Lange taken · Stille uren"
    description: >-
      Optioneel, bijv. 22:00-07:00. Dan wordt voor een taakresultaat geen sessie heropend en niets omgeroepen; het wacht tot ze voorbij zijn (of gaat per bericht als dat is ingesteld).
  live_task_imessage_to:
    name: "🧺 Lange taken · Berichtbestemming"
    description: >-
      Optioneel. Bestemmingsalias die de agentbrug kent, voor het terugvallen op een bericht.
  live_task_imessage_after_idle_s:
    name: "🧺 Lange taken · Eerst bericht na inactiviteit"
    description: >-
      Optioneel (standaard 0 = uit). Eerst een bericht sturen als het apparaat zo lang inactief is.
  live_task_progress_every_s:
    name: "🧺 Lange taken · Voortgangsinterval"
    description: >-
      Optioneel (standaard 25 s). Hoe vaak de stem mag zeggen dat ze nog met een taak bezig is, alleen als niemand praat.
  live_task_progress_max:
    name: "🧺 Lange taken · Voortgangsregels"
    description: >-
      Optioneel (standaard 3). Hoogstens zoveel voortgangsregels per taak.
  live_task_result_ttl_s:
    name: "🧺 Lange taken · Levensduur resultaat"
    description: >-
      Optioneel (standaard 900 s). Een onbezorgbaar resultaat wordt hierna verwijderd (en gelogd).
  live_task_deferred_max_s:
    name: "🧺 Lange taken · Levensduur wachttaak"
    description: >-
      Optioneel (standaard 86400 s). Een uitgestelde wachttaak die nooit afgaat wordt hierna vergeten.
  experiment_mode:
    name: "🧪 Testopstelling · Experimentmodus"
    description: >-
      Alleen voor ontwikkelaars (standaard uit). Laat de testopstelling
      timing- en modelvarianten proberen zonder nieuwe build. Verandert nooit
      een kostenlimiet.
  experiment_overrides:
    name: "🧪 Testopstelling · Experimentinstellingen"
    description: >-
      Alleen voor ontwikkelaars. JSON van de testopstelling; laat leeg.
      Genegeerd tenzij de experimentmodus aan staat.

  # --- 💵 GPT-Live kosten (verborgen, optioneel) ---
  live_idle_close_s:
    name: "💵 GPT-Live kosten · Sluiten na stilte (seconden)"
    description: >-
      Optioneel (standaard 10). GPT-Live rekent $0,05 per verbonden
      sessieminuut, per seconde afgerekend, en ook tijd waarin niets gebeurt
      telt mee. De sessie wordt daarom door een wake geopend en na deze
      stilte weer gesloten. Lager is goedkoper; hoger maakt een late
      vervolgvraag iets sneller.
  live_followup_s:
    name: "💵 GPT-Live kosten · Sessie vasthouden voor vervolgvraag (seconden)"
    description: >-
      Optioneel (standaard 8). Hoe lang de sessie na een antwoord open blijft
      zodat een vervolgvraag niet voor een nieuwe verbinding betaalt. Het
      vervolgvenster van het apparaat sluit meestal eerder. 0 = direct na het
      antwoord sluiten.
  live_rewake_grace_s:
    name: "💵 GPT-Live kosten · Respijt voor nieuwe wake (seconden)"
    description: >-
      Optioneel (standaard 0, maximaal 30). Houdt de betaalde, gereedstaande
      sessie kort open nadat het apparaat het vervolgvenster sluit. Een nieuwe
      wake binnen dit venster hergebruikt de sessie en slaat een nieuwe
      handshake over. 0 sluit direct en kost het minst.
  live_max_silent_s:
    name: "💵 GPT-Live kosten · Langste stille periode (seconden)"
    description: >-
      Optioneel (standaard 45). Harde grens voor een sessie waarin niets
      hoorbaar is en niemand spreekt — lang genoeg voor een trage opzoeking,
      kort genoeg dat een vastgelopen sessie niet blijft kosten. GPT-Live
      stuurt continu digitale stilte tussen antwoorden, dus "het model praat
      nog" wordt nooit op zichzelf vertrouwd.
  live_max_session_s:
    name: "💵 GPT-Live kosten · Maximale sessieduur (seconden)"
    description: >-
      Optioneel (standaard 300 = $0,25). Absolute grens voor één sessie, wat
      er ook gebeurt. Een nieuwe wake opent simpelweg een nieuwe sessie. Houd
      het onder 3300 zodat het binnen de 60-minutengrens van OpenAI blijft.
  live_max_session_minutes_per_day:
    name: "💵 GPT-Live kosten · Daglimiet (sessieminuten)"
    description: >-
      Optioneel (standaard 60 sessieminuten = $3,00 per dag, gedeeld door
      alle apparaten). Een HARDE grens: zodra die bereikt is weigert de
      assistent gesprekken en zegt dat hardop, tot het venster van 24 uur
      doorschuift. 0 schakelt deze grens uit — zet nooit beide grenzen uit.
  live_max_usd_per_day:
    name: "💵 GPT-Live kosten · Daglimiet (dollars)"
    description: >-
      Optioneel (standaard $3,00 per dag aan spreektijd, gedeeld door alle
      apparaten). Een HARDE grens, naast de sessieminutengrens; wat het eerst
      bereikt wordt stopt nieuwe sessies. Dit dekt alleen GPT-Live-sessietijd
      — de tokens van het achterliggende model worden apart gefactureerd en
      zijn hier niet meegerekend. 0 schakelt deze grens uit.

  # --- 🔍 Debug ---
  enable_recording:
    name: "🔍 Debug · Audio opnemen"
    description: >-
      Slaat microfoon- en speakeraudio op in bestanden binnen de add-on,
      alleen voor probleemanalyse. Normaal uit laten.
