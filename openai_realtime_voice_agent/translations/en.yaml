# User-facing names + help for the Configuration tab. The emoji prefixes are
# the only "grouping" HA's add-on UI supports — they match the order/groups in
# config.yaml. Keep descriptions PRACTICAL: what it does, when to change it,
# what value makes sense. A Dutch version lives in nl.yaml.
configuration:
  # --- 🔑 Basics ---
  openai_api_key:
    name: "🔑 Basics · OpenAI API key"
    description: >-
      Your personal OpenAI key (starts with sk-...). Create one at
      platform.openai.com → API keys, and make sure billing is set up.
      Everything the assistant does — listening, thinking, speaking, web
      search — runs on this key.
  instructions:
    name: "🔑 Basics · Assistant personality (system prompt)"
    description: >-
      Plain-text instructions that shape the assistant: its personality, its
      language, and your house rules. Write it like you'd brief a person. Two
      tips that matter on a voice device: lock the language ("Speak and
      understand only Dutch. Never switch language.") and tell it to use its
      tools silently instead of saying "one moment". EDITING TIP: this field
      is a single line here (a Home Assistant UI limitation) — for comfortable
      editing use the ⋮ menu at the top of this tab → "Edit in YAML", which
      gives you a full text editor.
  transcription_language:
    name: "🔑 Basics · Spoken language (e.g. nl, en, de)"
    description: >-
      Two-letter code of the language you speak to it. Setting it keeps the
      assistant from drifting into other languages and enables the user
      transcript (shown in the add-on log only when "Log transcripts" is on).
      Leave empty for auto-detect.

  # --- 🗣️ Model & voice ---
  openai_model:
    name: "🗣️ Model & voice · Model"
    description: >-
      The OpenAI model that listens and talks. gpt-realtime-2 (default) is the
      newest and smartest. gpt-realtime-mini is noticeably cheaper but less
      capable. Want a model that's not listed? Pick "custom", then enable
      "Show unused optional configuration options" at the bottom of this page
      to reveal the custom field.
  openai_model_custom:
    name: "🗣️ Model & voice · Model (custom)"
    description: >-
      Only used when Model is set to "custom". Any valid OpenAI Realtime
      model id. (Hidden by default — this is an expert escape hatch.)
  openai_voice:
    name: "🗣️ Model & voice · Voice"
    description: >-
      The voice it speaks with. marin and cedar are the newest and sound the
      most natural. A running conversation keeps its voice — restart the
      add-on after changing this. For an unlisted voice pick "custom" and
      enable "Show unused optional configuration options" at the bottom.
  openai_voice_custom:
    name: "🗣️ Model & voice · Voice (custom)"
    description: >-
      Only used when Voice is set to "custom". Any valid OpenAI voice name.
      (Hidden by default.)
  openai_speed:
    name: "🗣️ Model & voice · Speaking speed"
    description: >-
      1.0 = normal. Lower is slower and clearer (down to 0.25), higher is
      faster (up to 1.5). Changes only the pace, not the words.
  max_output_tokens:
    name: "🗣️ Model & voice · Maximum answer length"
    description: >-
      Caps how long an answer may get, in tokens (≈ 0.75 words each).
      0 = no cap. Set e.g. 1024 if it sometimes rambles on; too low cuts
      answers off mid-sentence.

  # --- 💬 Conversation ---
  follow_up_listen_seconds:
    name: "💬 Conversation · Follow-up listening (seconds)"
    description: >-
      After an answer the device keeps listening this long, so you can simply
      keep talking — no wake word needed. The LED ring shows the listening
      colour while it waits. 8 feels natural; 0 turns it off (wake word
      before every question).
  follow_up_open_delay_ms:
    name: "💬 Conversation · Follow-up mic delay (ms)"
    description: >-
      Short pause between the end of an answer and the microphone re-opening,
      so the speaker's last echo can't trigger a ghost question. 700 (default)
      covers the speaker tail safely. Lowering it (300–500) makes the
      hand-over snappier, but risks the assistant answering its own echo —
      raise it back if it sometimes seems to answer nobody or repeats itself.
  wake_open_delay_ms:
    name: "💬 Conversation · Wake mic delay (ms)"
    description: >-
      The same echo guard right after the wake word: a short pause after the
      wake chime before the microphone opens, so the chime's own sound can't
      leak in and be mistaken for a question. 700 (default) is safe. Lower it
      for a snappier wake, raise it if saying the wake word sometimes triggers
      an answer to nothing.
  vad_eagerness:
    name: "💬 Conversation · Turn-taking speed"
    description: >-
      How quickly the assistant decides you've finished talking. "low"
      (default) waits patiently — best if you pause mid-sentence to think.
      "high" answers faster but may cut you off. "auto" lets OpenAI decide.
  phase_idle_debounce_ms:
    name: "💬 Conversation · End-of-answer hold (ms)"
    description: >-
      How long the assistant must stay silent before the device considers the
      answer finished. This bridges the natural pauses between sentences and
      during smart-home actions, so the LED and the "stop" word keep working
      through the whole answer. 1500 is a good default; raise it if the
      device flips to idle in the middle of long answers.

  # --- 🌐 Web search ---
  enable_web_search:
    name: "🌐 Web search · Enable web search"
    description: >-
      Lets the assistant look things up online: weather, news, opening hours,
      recent events. Each lookup is one extra OpenAI call on your key (a few
      cents) and adds a couple of seconds. On by default.
  web_search_model:
    name: "🌐 Web search · Search model"
    description: >-
      The model that does the lookup and summarises the answer. gpt-5.5
      (default) gives the best answers; mini/nano models are cheaper but miss
      more. For an unlisted model pick "custom" and enable "Show unused
      optional configuration options" at the bottom.
  web_search_model_custom:
    name: "🌐 Web search · Search model (custom)"
    description: >-
      Only used when Search model is set to "custom". Any model that supports
      OpenAI's web_search tool. (Hidden by default.)

  # --- 🎚️ Audio ---
  playback_prebuffer_ms:
    name: "🎚️ Audio · Playback buffer (ms)"
    description: >-
      How much of the answer the device collects before it starts playing. A
      bigger buffer absorbs brief Wi-Fi hiccups (the occasional crackle), but
      every answer starts this much later. 150 is a good balance; raise to
      250–300 if you still hear crackle, 0 = play immediately.
  output_lead_buffer_ms:
    name: "🎚️ Audio · Reply start lead (ms)"
    description: >-
      Holds the first part of each reply for this long and sends it as one
      burst, so the device starts playback with a cushion. Helps when replies
      start with a click or stutter; costs about this much latency on the
      first word. 0 = off (default); try 400 if replies start clipped. The
      per-turn latency sensor shows the effect.
  noise_reduction:
    name: "🎚️ Audio · Microphone noise reduction"
    description: >-
      Extra filtering of your voice before it reaches OpenAI. "off" is
      usually fine — the device already filters. Try "near_field" if you
      talk close to the device, "far_field" for across the room, when it
      mishears you in a noisy environment.

  # --- 🏠 Home Assistant ---
  speaker_male_name:
    name: "🗣️ Speakers · Male voice name"
    description: >-
      Name to use when a male voice is detected (e.g. "James"). Leave both
      name fields empty to disable speaker detection entirely. Detection is a
      pitch heuristic for a one-male-one-female household — it cannot tell two
      men apart, and same-voice-type guests are matched to that name.
  speaker_female_name:
    name: "🗣️ Speakers · Female voice name"
    description: >-
      Name to use when a female voice is detected (e.g. "Mary").
  male_only_tools:
    name: "🗣️ Speakers · Male-only tools"
    description: >-
      Comma-separated tool names that only execute when the detected speaker is
      the male voice (e.g. "ask_openclaw"). Enforced below the model, so it
      cannot be talked around. Convenience gating, not biometric security.
  ha_mcp_url:
    name: "🏠 Home Assistant · MCP server URL"
    description: >-
      How the assistant controls your home. Leave EMPTY (recommended): it
      then uses Home Assistant's built-in "MCP Server" integration — install
      that integration and expose your entities to Assist. Only fill in a URL
      if you run the separate ha-mcp add-on instead.
  longlived_token:
    name: "🏠 Home Assistant · Access token"
    description: >-
      Leave empty (recommended): the add-on uses its own built-in permission.
      Only create and paste a long-lived token (your HA profile → Security)
      if the log shows a 401/403 error at startup.
  mcp_tool_allowlist:
    name: "🏠 Home Assistant · Tool allow-list"
    description: >-
      Comma-separated list of control tools the assistant may use; empty =
      all of them. With the built-in MCP server you can leave this empty.
      Mainly useful with the ha-mcp add-on (80+ tools) to keep conversations
      fast and cheap.

  # --- ⚙️ Advanced ---
  websocket_port:
    name: "⚙️ Advanced · Device port"
    description: >-
      The port the Voice PE connects to. Must match the va_url in the device
      firmware (stable 8080, dev 8081). Only change this on a port clash —
      and update the device firmware stub to match.
  session_reuse_timeout_seconds:
    name: "⚙️ Advanced · Conversation resume window (seconds)"
    description: >-
      If the device reconnects within this many seconds (Wi-Fi blip, add-on
      restart), the conversation continues where it left off. 300 (5 min) is
      a good default; 0 = always start fresh.
  max_context_messages:
    name: "⚙️ Advanced · Conversation memory size"
    description: >-
      How many recent exchanges the assistant remembers within a
      conversation. More = better memory, but every answer re-bills the whole
      history, so long chats get expensive and can hit OpenAI rate limits.
      12 is a good balance; 0 = unlimited.
  transcription_model:
    name: "⚙️ Advanced · Transcript model"
    description: >-
      Only used when a spoken language is set (Basics). This model writes
      your speech into the log as text — it does NOT affect how the assistant
      understands you (it hears your actual voice). gpt-live-transcribe is
      optimized for low-latency live transcription; gpt-transcribe is optimized
      for completed audio. gpt-4o-transcribe remains the default. For an
      unlisted model pick "custom" and enable "Show unused optional
      configuration options" at the bottom.
  transcription_model_custom:
    name: "⚙️ Advanced · Transcript model (custom)"
    description: >-
      Only used when Transcript model is set to "custom". (Hidden by
      default.)
  turn_detection_type:
    name: "⚙️ Advanced · Turn detection (legacy)"
    description: >-
      How the end of your question is detected. Normally leave this UNSET:
      the assistant then understands when your sentence is finished
      (semantic_vad). "server_vad" is the old silence-timer method, tuned by
      the three fields below — kept only as an escape hatch.
  vad_threshold:
    name: "⚙️ Advanced · server_vad: loudness threshold"
    description: >-
      Only with server_vad. How loud something must be to count as speech
      (0–1, default 0.5). Higher = fewer false triggers from background
      noise.
  vad_prefix_padding_ms:
    name: "⚙️ Advanced · server_vad: lead-in (ms)"
    description: >-
      Only with server_vad. Audio kept from just before speech was detected,
      so your first word isn't clipped (default 300).
  vad_silence_duration_ms:
    name: "⚙️ Advanced · server_vad: silence to end turn (ms)"
    description: >-
      Only with server_vad. How long a silence ends your question (default
      800). Raise it if you get cut off while pausing.

  # --- 🔐 Privacy & safety ---
  wake_capture:
    name: "🔐 Privacy · Wake data kept on this host"
    description: >-
      What is stored about wakes, on your Home Assistant host only (never
      uploaded by the add-on). auto = short audio clips only if "Record
      audio" is on, otherwise metadata; off = nothing at all; metadata =
      counters and wake metadata (time, device, model, threshold, your
      false-wake flags), no audio; audio = metadata plus a few seconds after
      each wake, used to review false wakes. Clips expire automatically.
  trigger_capture:
    name: "🔐 Privacy · Keep the sound that triggered a wake"
    description: >-
      Also keep the ~1.5 seconds BEFORE each wake (what the device thought was
      the wake word) — the most useful audio for fixing false wakes. Needs
      "Wake data kept" = audio AND the device's own "Share wake trigger audio"
      switch. Stays on this host.
  log_transcripts:
    name: "🔐 Privacy · Log transcripts"
    description: >-
      Write what you and the assistant said into the add-on log. Off by
      default because transcripts are personal data; turn on briefly when
      debugging.
  device_token:
    name: "🔐 Security · Device token"
    description: >-
      Shared secret the Voice PE must present when it connects. Set the same
      value as va_token in the device firmware. Empty = the socket is open to
      every host on your network (the add-on logs a warning).
  device_auth:
    name: "🔐 Security · Device token policy"
    description: >-
      auto = require the token once one is set. permissive = accept devices
      without a valid token but log them (use while reflashing). enforce =
      require it. off = never check. enforce and permissive need a token;
      without one the check stays off and the add-on logs a warning.
  confirm_actions:
    name: "🔐 Safety · Actions that need a spoken yes"
    description: >-
      Comma-separated: lock (unlocking), garage, gate, door (opening those
      covers), alarm (any alarm panel action). The action only runs after you
      answer the assistant's yes/no question. Enforced below the model. Empty
      = no confirmations.
  slow_tool_ack:
    name: "💬 Conversation · Acknowledge slow lookups"
    description: >-
      When a slow lookup (web search, your agent) is still running after about
      a second, the device says "One moment." once. Fast smart-home commands
      never trigger it.
  speak_errors:
    name: "💬 Conversation · Say when something fails"
    description: >-
      If a request you started fails (rate limit, failed response), the device
      says so out loud instead of just going quiet. Falls back to the error
      chime if the message cannot be produced.
  tts_style:
    name: "💬 Conversation · Speaking style for announcements"
    description: >-
      Style instructions for timer messages, announcements, acknowledgements
      and the enrollment coach (e.g. "Calm and friendly."). Empty = neutral.
  wake_capture_ttl_days:
    name: "🔐 Privacy · Unlabeled clip lifetime (days)"
    description: >-
      Optional. Unreviewed wake clips are deleted after this many days
      (default 30). Clips you flagged as false wakes are kept separately.
  wake_label_ttl_days:
    name: "🔐 Privacy · Flagged clip lifetime (days)"
    description: >-
      Optional. Clips you flagged as false wakes are deleted after this many
      days (default 180).
  false_wake_flag_window_s:
    name: "🔐 Privacy · False-wake flag window (seconds)"
    description: >-
      Optional. A double press or "that was a false alarm" labels this
      device's wake only if it happened within this many seconds (default 30).
  guest_mode_entity:
    name: "🔐 Privacy · Guest mode switch"
    description: >-
      Optional input_boolean or switch entity. While it is on, nothing about
      wakes is stored.
  device_allowlist:
    name: "🔐 Security · Allowed device addresses"
    description: >-
      Optional comma-separated IPs or networks (e.g. 192.0.2.10/32). Other
      hosts cannot connect at all. Works without reflashing.
  confirm_tools:
    name: "🔐 Safety · Extra tools that need a spoken yes"
    description: >-
      Optional comma-separated tool names (e.g. an exposed script) that
      always need confirmation.
  slow_tools:
    name: "💬 Conversation · Tools treated as slow"
    description: >-
      Optional. Default web_search,ask_openclaw. Any tool whose measured
      median exceeds 1.2 s also qualifies automatically.
  tts_voice:
    name: "💬 Conversation · Announcement voice"
    description: >-
      Optional speech voice for prompts; defaults to the assistant's voice
      when the speech endpoint supports it, otherwise alloy.
  mcp_persistent_session:
    name: "🏠 Home Assistant · Reuse the MCP session"
    description: >-
      Optional (default on). Reuses one Home Assistant tool session instead of
      opening a new one for every command.
  web_search_timeout_s:
    name: "🌐 Web search · Timeout (seconds)"
    description: >-
      Optional (default 20). A search that takes longer is stopped and the
      assistant says so.

  # --- 🔍 Debug ---
  enable_recording:
    name: "🔍 Debug · Record audio"
    description: >-
      Saves microphone and speaker audio to files inside the add-on, for
      troubleshooting only. Leave off normally. (Also enables short wake
      clips when "Wake data kept" is auto.)

  # --- 🧩 Fork features ---
  instance_name:
    name: "🧩 Fork · Instance name (room)"
    description: >-
      Short name for this add-on instance (e.g. kitchen). Used in the Home
      Assistant sensor names. One instance can serve several devices; each
      device is addressed by its own device_id.
  wake_sound_entity:
    name: "🧩 Fork · Wake sound switch entity"
    description: >-
      Optional switch entity that enables/disables the device's wake chime,
      so voice enrollment can silence it during guided training.
  timer_ring_entity:
    name: "🧩 Fork · Timer ring switch entity"
    description: >-
      The device's timer_ringing switch entity (e.g.
      switch.voice_pe_timer_ringing). Voice timers announce first, then ring
       this if unacknowledged. Leave empty to disable ringing.
  timer_ring_entities:
    name: "🧩 Fork · Per-device timer ring switches"
    description: >-
      For one shared multi-device add-on, map each device id to its timer switch:
      kitchen=switch.kitchen_timer_ringing,office=switch.office_timer_ringing.
  enrollment_phrase:
    name: "🧩 Fork · Enrollment wake phrase"
    description: >-
      The wake phrase practiced during guided voice enrollment. Set it to
      your actual wake word (default: hey leonard).
  enrollment_tts_voice:
    name: "🧩 Fork · Enrollment coach voice"
    description: >-
      OpenAI TTS voice used by the enrollment audio coach (default fable).
  openclaw_url:
    name: "🧩 Fork · Agent bridge URL"
    description: >-
      Direct endpoint of your external agent bridge (POST {"question"} →
      {"answer"}, {"recall"} → {"matches"}). Enables ask_openclaw without the
      60-second Home Assistant MCP cap, plus the instant recall_memory tool.
      Leave empty to use whatever your MCP server exposes.
  announce_port:
    name: "🧩 Fork · Announce port"
    description: >-
      Port for the LAN announce endpoint (e.g. 8090). External agents POST
      /announce {"message"} to speak in this room. 0 disables. Requires the
      announce token too.
  announce_token:
    name: "🧩 Fork · Announce token"
    description: >-
      Bearer token protecting the announce endpoint. Generate a long random
      string; anyone on your LAN with this token can speak through the device.
