name: Build and Publish Home Assistant Addon

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
      - '.github/workflows/build-addon.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'openai_realtime_voice_agent/**'
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read

# Two jobs share one list of steps (YAML anchor): pull requests build without
# pushing and get a read-only token; push, release and manual runs publish to
# GHCR and are the only ones that get packages: write.
jobs:
  build:
    name: Build for ${{ matrix.arch }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy: &build-strategy
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64

    steps: &build-steps
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Extract version from config.yaml
        id: version
        run: |
          VERSION=$(grep '^version:' openai_realtime_voice_agent/config.yaml | sed 's/version: "\(.*\)"/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $VERSION"

      - name: Normalize image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=${REPOSITORY,,}/openai-realtime-voice-agent" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
        with:
          platforms: linux/arm64,linux/amd64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Map architecture
        id: arch-map
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          case "$ARCH" in
            aarch64)
              echo "platform=linux/arm64" >> $GITHUB_OUTPUT
              ;;
            amd64)
              echo "platform=linux/amd64" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25  # v5.4.0
        with:
          context: ./openai_realtime_voice_agent
          file: ./openai_realtime_voice_agent/Dockerfile
          platforms: ${{ steps.arch-map.outputs.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-${{ matrix.arch }}:${{ steps.version.outputs.version }}-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}-${{ matrix.arch }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base-debian:bookworm

      - name: Generate image manifest
        if: github.event_name != 'pull_request' && matrix.arch == 'amd64'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Image built: ${REGISTRY}/${IMAGE}-${ARCH}:${VERSION}"

  publish:
    name: Publish for ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push the add-on images to GHCR
    strategy: *build-strategy
    steps: *build-steps
