name: Test Add-on

# Runs on every change: the public-surface scan and the docs link check cover
# docs/, examples/ and demo/, not just the add-on code.
on:
  push:
    branches:
      - main
      - master
      - "remediation/**"
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Python (the add-on image's version)
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.11'

      - name: Install add-on dependencies
        working-directory: openai_realtime_voice_agent
        run: python -m pip install .

      - name: Byte-compile app and demo
        run: python -m compileall -q openai_realtime_voice_agent/app demo

      - name: Unit tests (fails if discovery silently shrinks the suite)
        working-directory: openai_realtime_voice_agent
        env:
          MIN_TESTS: "190"
        run: |
          PYTHONPATH=. python - <<'EOF'
          import os
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          count = suite.countTestCases()
          print(f"discovered {count} tests")
          if count < int(os.environ["MIN_TESTS"]):
              sys.exit(f"only {count} tests discovered, expected at least {os.environ['MIN_TESTS']}")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          sys.exit(0 if result.wasSuccessful() else 1)
          EOF

      - name: Demo script (simulated add-on, no network)
        run: python -m unittest discover -s demo/tests -v
