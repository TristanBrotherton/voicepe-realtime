---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The add-on's Python dependencies (pyproject.toml + poetry.lock).
  - package-ecosystem: "pip"
    directory: "/openai_realtime_voice_agent"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # Any pipecat past 0.0.97 is a migration, not a bump: 0.0.108 already
      # breaks the add-on at import (most test modules fail to load), and 1.x
      # also changes tool, interruption and audio behaviour. The parked work
      # is on the feat/pipecat-1.13 branch.
      - dependency-name: "pipecat-ai"

  # Hash-locked CI tools (zizmor, bandit).
  - package-ecosystem: "pip"
    directory: "/.github/ci"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
