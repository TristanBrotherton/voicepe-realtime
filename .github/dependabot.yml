---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  # The add-on's Python dependencies (pyproject.toml + poetry.lock).
  - package-ecosystem: "pip"
    directory: "/openai_realtime_voice_agent"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # pipecat 1.x is a migration, not a bump: it breaks the add-on at import
      # and changes tool, interruption and audio behaviour. The parked work is
      # on the feat/pipecat-1.13 branch; patch releases of the pinned 0.0.x
      # line still come through.
      - dependency-name: "pipecat-ai"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Hash-locked CI tools (zizmor, bandit).
  - package-ecosystem: "pip"
    directory: "/.github/ci"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
